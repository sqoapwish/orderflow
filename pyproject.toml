[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "orderflow"
version = "0.1.0"
description = "Order and inventory management backend with reliable payment workflows"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aio-pika>=10.0.1,<11",
    "alembic>=1.19.0,<2",
    "asyncpg>=0.31.0,<1",
    "celery>=5.6.3,<6",
    "fastapi>=0.141.1,<1",
    "greenlet==3.5.4",
    "pydantic-settings>=2.15.0,<3",
    "redis>=8.1.0,<9",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "structlog>=26.1.0,<27",
    "uvicorn[standard]>=0.52.1,<1",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.28.1,<1",
    "mypy>=2.3.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.2,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orderflow"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL, Redis, and RabbitMQ",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["orderflow"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["orderflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
